name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    if: github.event_name == 'push'
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: |
      always() &&
      (needs.release-please.result == 'skipped' || needs.release-please.outputs.release_created == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # No registry-url: nothing here publishes to npmjs.org any more.

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # The binaries + Homebrew formula. Called rather than tag-triggered: the tag
  # release-please creates is made with the default GITHUB_TOKEN, and GitHub
  # does not fire workflows from that token's events, so a `push: tags` trigger
  # would never run and the release would carry no assets.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yaml
    secrets: inherit
