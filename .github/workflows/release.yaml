name: release

# Homebrew + release-asset distribution, replacing the npm publish. Compiles the
# TypeScript MCP server to a single self-contained binary with
# `bun build --compile`, ships it as a GitHub release asset, and renders
# Formula/mcp-new-relic.rb into neverprepared/homebrew-tap.
#
# The linux assets are not optional extras. The phantom MCP gateway runs in a
# Debian container, where Homebrew cannot reach (every formula in the tap is
# `depends_on :macos`), so the gateway bakes the linux tarball instead. Adapted
# from neverprepared/mcp-kroki, which already distributes this way.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Not --frozen-lockfile: the repo ships package-lock.json (npm is used
        # for dev/tests) and bun migrates it on install, which trips the check.
        run: bun install

      - name: Compile binaries (darwin + linux)
        run: |
          build() { mkdir -p build && bun build --compile --target="$1" ./src/index.ts --outfile build/mcp-new-relic && tar -czf "$2" -C build mcp-new-relic && rm -rf build; }
          build bun-darwin-arm64 mcp-new-relic_darwin_arm64.tar.gz
          build bun-linux-arm64  mcp-new-relic_linux_arm64.tar.gz
          build bun-linux-x64    mcp-new-relic_linux_amd64.tar.gz

      - name: Resolve version + checksum
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 mcp-new-relic_darwin_arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="mcp-new-relic_darwin_arm64.tar.gz mcp-new-relic_linux_arm64.tar.gz mcp-new-relic_linux_amd64.tar.gz"
          gh release create "${GITHUB_REF_NAME}" $assets \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" $assets \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Render + push Homebrew formula
        env:
          # Org-level secret: a fine-grained PAT with contents:write on
          # neverprepared/homebrew-tap. Same one mcp-kroki and mcp-slack use.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping formula push (the release assets are already published)."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/neverprepared/homebrew-tap.git" tap
          cat > tap/Formula/mcp-new-relic.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          # Generated by neverprepared/mcp-new-relic release workflow. Do not edit by hand.
          class McpNewRelic < Formula
            desc "MCP server for New Relic - NRQL queries, alerts, dashboards, and account metrics"
            homepage "https://github.com/neverprepared/mcp-new-relic"
            version "${VERSION}"
            license "MIT"
            depends_on :macos

            if Hardware::CPU.arm?
              url "https://github.com/neverprepared/mcp-new-relic/releases/download/v${VERSION}/mcp-new-relic_darwin_arm64.tar.gz"
              sha256 "${SHA256}"

              define_method(:install) do
                bin.install "mcp-new-relic"
              end
            end

            def caveats
              <<~EOS
                Requires New Relic credentials:
                  NEW_RELIC_API_KEY=...    a User key
                  NEW_RELIC_ACCOUNT_ID=... numeric account id
                  NEW_RELIC_REGION=US      or EU

                Configure your MCP host (e.g. Claude Code) to run:
                  mcp-new-relic
              EOS
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mcp-new-relic.rb
          git commit -m "mcp-new-relic ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
